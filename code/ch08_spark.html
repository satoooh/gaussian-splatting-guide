<!doctype html>
<meta charset="utf-8">
<title>Sparkで料理の3DGSを表示する</title>
<style>body{margin:0}</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new SparkRenderer({ renderer }));
scene.add(new SplatMesh({ url: "https://satoooh.github.io/gaussian-splatting-guide/splats/bowl.splat" }));

// SfMの座標には、どちらが上かの決まりがない。料理の中心と上の向きをカメラに教える
const center = new THREE.Vector3(0.2, 2.37, 2.6), up = new THREE.Vector3(-0.073, -0.775, -0.628);
camera.up.copy(up);
camera.position.copy(center).addScaledVector(up, 3).add(new THREE.Vector3(2, 0, 0));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(center);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
